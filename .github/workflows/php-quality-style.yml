name: PHP Quality and Style

on:
    pull_request:
        branches: [develop]
    push:
        paths:
            - '.github/workflows/php-quality-style.yml'
            - '**.php'
            - 'phpstan.neon.dist'
            - 'rector.php'

concurrency:
    group: ${{ github.workflow }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
    cancel-in-progress: true

permissions: {}

jobs:
    php-quality-style:
        name: PHP Quality and Style
        runs-on: ubuntu-latest
        timeout-minutes: 5
        permissions:
            contents: write

        steps:
            - name: Harden runner
              uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
              with:
                  egress-policy: audit

            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Setup PHP
              uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
              with:
                  php-version: '8.2'
                  extensions: json, dom, curl, libxml, mbstring, zip
                  tools: composer:v2
                  coverage: none

            - name: Install dependencies
              run: composer install --no-progress --prefer-dist --optimize-autoloader

            - name: Run Rector
              run: composer refactor

            - name: Commit changes
              uses: stefanzweifel/git-auto-commit-action@4a55954c782fc1ea30b9056cd3e7a2b40ca8887d # v7.2.0
              with:
                  commit_message: Refactor code with Rector

            - name: Run Pint
              run: composer format

            - name: Commit changes
              uses: stefanzweifel/git-auto-commit-action@4a55954c782fc1ea30b9056cd3e7a2b40ca8887d # v7.2.0
              with:
                  commit_message: Format code with Pint

            - name: Run PHPStan
              run: composer analyse
