name: Consumer Smoke

# Installs Inertia Modal the way a real customer does (clean vendor/ copy, real
# npm via file:, no Vite dedupe) and asserts the modal opens via the Inertia
# router with no duplicate Inertia/Vue/React copy bundled. The demo-app cannot
# catch this: it links the library through the pnpm workspace from a sibling
# directory, where resolution and dedupe behave differently than a real install.

on:
    push:
        paths:
            - 'vue/**'
            - 'react/**'
            - 'src/**'
            - '**/package.json'
            - 'consumer-smoke/**'
            - '.github/workflows/consumer-smoke.yml'
            - '.gitattributes'
            - 'pnpm-lock.yaml'
            - 'pnpm-workspace.yaml'
    pull_request:
        paths:
            - 'vue/**'
            - 'react/**'
            - 'src/**'
            - '**/package.json'
            - 'consumer-smoke/**'
            - '.github/workflows/consumer-smoke.yml'
            - '.gitattributes'
            - 'pnpm-lock.yaml'
            - 'pnpm-workspace.yaml'
    workflow_dispatch:

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions: {}

jobs:
    # Build both frontend packages once. The matrix jobs consume these dist
    # files instead of rebuilding the library per stack.
    package-surface:
        name: Consumer Smoke Package Surface
        runs-on: ubuntu-latest
        timeout-minutes: 15
        if: "github.event_name == 'pull_request' || (!contains(github.event.head_commit.message, '[only-quality]') && !contains(github.event.head_commit.message, '[ci-skip]') && !contains(github.event.head_commit.message, '[skip-ci]'))"

        permissions:
            contents: read

        steps:
            - name: Harden runner
              uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
              with:
                  egress-policy: audit

            - name: Checkout code
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
              with:
                  persist-credentials: false

            - name: Install pnpm
              uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8

            - name: Setup Node.js
              uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
              with:
                  node-version: '22'
                  cache: pnpm

            - name: Build the modal library
              run: |
                  pnpm install --frozen-lockfile
                  pnpm --filter "@inertiaui/modal-vue" build
                  pnpm --filter "@inertiaui/modal-react" build

            - name: Upload built frontend packages
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: consumer-smoke-built-frontend-packages
                  path: |
                      vue/dist
                      react/dist
                  if-no-files-found: error
                  retention-days: 1

    consumer-smoke:
        name: Consumer Smoke (${{ matrix.stack }})
        timeout-minutes: 20
        runs-on: ubuntu-latest
        needs: package-surface
        if: "github.event_name == 'pull_request' || (!contains(github.event.head_commit.message, '[only-quality]') && !contains(github.event.head_commit.message, '[ci-skip]') && !contains(github.event.head_commit.message, '[skip-ci]'))"

        permissions:
            contents: read

        strategy:
            fail-fast: false
            matrix:
                stack: [vue, react]

        steps:
            - name: Harden runner
              uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
              with:
                  egress-policy: audit

            - name: Checkout code
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
              with:
                  persist-credentials: false

            - name: Setup PHP
              uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc # 2.37.1
              with:
                  php-version: '8.4'
                  extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, intl
                  coverage: none

            - name: Setup Node.js
              uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
              with:
                  node-version: '22'

            - name: Download built frontend packages
              uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
              with:
                  name: consumer-smoke-built-frontend-packages
                  path: .

            - name: Install smoke-test dependencies
              run: |
                  npm install --no-audit --no-fund
                  npx playwright install --with-deps chromium
              working-directory: consumer-smoke

            - name: Scaffold + build the consumer app
              id: scaffold
              env:
                  STACK: ${{ matrix.stack }}
                  MODAL_REPO: ${{ github.workspace }}
                  WORK: ${{ runner.temp }}/consumer-smoke
              run: |
                  set -o pipefail
                  SETUP_LOG="$RUNNER_TEMP/setup-${{ matrix.stack }}.log"
                  bash consumer-smoke/setup.sh | tee "$SETUP_LOG"
                  consumer="$(tail -1 "$SETUP_LOG")"
                  test -n "$consumer"
                  test -d "$consumer"
                  echo "consumer=$consumer" >> "$GITHUB_OUTPUT"

            - name: Serve + smoke test
              env:
                  CONSUMER: ${{ steps.scaffold.outputs.consumer }}
              run: |
                  cd "$CONSUMER"
                  SERVE_LOG="$RUNNER_TEMP/serve-${{ matrix.stack }}.log"
                  php artisan serve --port=8000 > "$SERVE_LOG" 2>&1 &
                  up=
                  for i in $(seq 1 30); do
                      curl -fsS -o /dev/null "http://127.0.0.1:8000/modal-smoke" && { up=1; break; }
                      sleep 1
                  done
                  if [ -z "$up" ]; then echo "server failed to start:"; cat "$SERVE_LOG"; exit 1; fi
                  node "$GITHUB_WORKSPACE/consumer-smoke/smoke.mjs" "http://127.0.0.1:8000"

            - name: Upload logs on failure
              if: failure()
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: consumer-smoke-${{ matrix.stack }}
                  path: |
                      ${{ runner.temp }}/setup-${{ matrix.stack }}.log
                      ${{ runner.temp }}/serve-${{ matrix.stack }}.log
