name: Semgrep

on:
    push:
        branches: [3.x, 2.x]
    pull_request:
        branches: [3.x, 2.x]
    schedule:
        - cron: '37 4 * * 1'

permissions: {}

jobs:
    semgrep:
        name: Semgrep scan
        runs-on: ubuntu-latest
        timeout-minutes: 15

        permissions:
            contents: read

        steps:
            - name: Harden runner
              uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
              with:
                  egress-policy: audit

            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Setup Python
              uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
              with:
                  python-version: '3.12'

            - name: Install Semgrep
              run: pip install semgrep==1.164.0

            - name: Run Semgrep
              run: semgrep scan --config=p/default --config=p/security-audit --config=p/owasp-top-ten --error --severity=ERROR
