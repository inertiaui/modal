name: Semgrep

on:
    push:
        branches: [3.x, 2.x]
    pull_request:
        branches: [3.x, 2.x]
    schedule:
        - cron: '37 4 * * 1'

permissions: {}

jobs:
    semgrep:
        name: Semgrep scan
        runs-on: ubuntu-latest
        timeout-minutes: 15

        permissions:
            contents: read

        steps:
            - name: Harden runner
              uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
              with:
                  egress-policy: audit

            - name: Checkout
              uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
              with:
                  persist-credentials: false

            - name: Setup Python
              uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
              with:
                  python-version: '3.12'

            - name: Install Semgrep
              run: pip install semgrep==1.164.0

            - name: Run Semgrep
              run: semgrep scan --config=p/default --config=p/security-audit --config=p/owasp-top-ten --error --severity=ERROR
