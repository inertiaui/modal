name: Tests

on:
    pull_request:
        branches: [develop]
    push:
        paths:
            - '**.js'
            - '**.jsx'
            - '**.ts'
            - '**.tsx'
            - '**.php'
            - '**.vue'
            - '**/composer.json'
            - '**/package.json'
            - 'pnpm-lock.yaml'
            - 'pnpm-workspace.yaml'
            - 'demo-app/.env.example'
            - 'demo-app/phpunit.xml.dist'
            - '.github/workflows/tests.yml'

permissions: {}

jobs:
    tests:
        name: Pest L${{ matrix.laravel }} (${{ matrix.stack }}), App Mounting ${{ matrix.app_mounting }}, Native Dialog ${{ matrix.native_dialog }}
        timeout-minutes: 15
        runs-on: ubuntu-latest

        permissions:
            contents: read

        strategy:
            fail-fast: false
            matrix:
                laravel: ['13.0', '12.0']
                stack: [react, vue]
                app_mounting: [auto, custom]
                native_dialog: [true, false]

        env:
            APP_URL: 'http://127.0.0.1:8000'
            DB_CONNECTION: sqlite
            APP_STACK: ${{ matrix.stack }}
            VITE_USE_NATIVE_DIALOG: ${{ matrix.native_dialog }}
            MATRIX_LARAVEL: ${{ matrix.laravel }}
            MATRIX_STACK: ${{ matrix.stack }}

        steps:
            - name: Harden runner
              uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
              with:
                  egress-policy: audit

            - name: Checkout code
              uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
              with:
                  persist-credentials: false

            - name: Setup PHP
              uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
              with:
                  php-version: ${{ matrix.laravel == '13.0' && '8.4' || '8.3' }}
                  extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv, imagick, mysql, mysqli, pdo_mysql
                  coverage: none

            - name: Install pnpm
              uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

            - name: Setup Node.js
              uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
              with:
                  node-version: lts/*
                  cache: pnpm

            - name: Get Composer Cache Directory
              id: composer-cache
              run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

            - name: Cache composer
              uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
              with:
                  path: ${{ steps.composer-cache.outputs.dir }}
                  key: ${{ runner.os }}-composer-${{ matrix.stack }}-${{ hashFiles('**/composer.lock') }}
                  restore-keys: |
                      ${{ runner.os }}-composer-${{ matrix.stack }}-
                      ${{ runner.os }}-composer-

            - name: Install pnpm dependencies
              run: pnpm install --frozen-lockfile

            - name: Prepare The Environment
              run: |
                  cd demo-app
                  cp .env.example .env

            - name: Set React Environment Variables
              if: ${{ matrix.stack == 'react' }}
              run: |
                  cd demo-app
                  sed -i -e "s|APP_STACK=vue|APP_STACK=react|g" .env

            - name: Build libraries
              run: |
                  pnpm --filter @inertiaui/modal-vue run build
                  pnpm --filter @inertiaui/modal-react run build

            - name: Test libraries
              env:
                  MATRIX_STACK: ${{ matrix.stack }}
              run: pnpm --filter "@inertiaui/modal-$MATRIX_STACK" run test --run

            - name: Switch to custom app mounting
              if: ${{ matrix.app_mounting == 'custom' }}
              run: |
                  cd demo-app/resources/js
                  mv app-custom-mount.js app.js
                  mv app-custom-mount.jsx app.jsx

            - name: Prepare Laravel app
              run: |
                  cd demo-app
                  if [ "$MATRIX_LARAVEL" == "13.0" ]; then
                    composer remove laravel/tinker --no-update
                    composer require "laravel/framework:^$MATRIX_LARAVEL" --no-update --no-interaction
                    composer update -W --no-progress --prefer-dist --no-interaction
                  else
                    composer require "laravel/framework:^$MATRIX_LARAVEL" --no-interaction
                  fi
                  php artisan about
                  test -d node_modules/@inertiaui/modal-react || exit 1
                  test -d node_modules/@inertiaui/modal-vue || exit 1
                  pnpm --filter demo-app run build
                  php artisan key:generate
                  touch database/database.sqlite
                  php artisan migrate:fresh --seed

            - name: Install Playwright
              run: |
                  cd demo-app
                  pnpm exec playwright install --with-deps chromium

            - name: Run tests
              run: |
                  cd demo-app
                  ./vendor/bin/pest --parallel

            - name: Upload artifacts on failure
              if: failure()
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: pest-artifacts-${{ matrix.laravel }}-${{ matrix.stack }}-${{ matrix.app_mounting }}-${{ matrix.native_dialog }}
                  path: |
                      demo-app/tests/Browser/Screenshots
                      demo-app/storage/logs
