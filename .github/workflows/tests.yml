name: Integration Tests

on:
    pull_request:
        branches: [develop]
    push:
        paths:
            - '**.js'
            - '**.jsx'
            - '**.ts'
            - '**.tsx'
            - '**.php'
            - '**.vue'
            - '**/composer.json'
            - '**/package.json'
            - '.gitattributes'
            - 'pnpm-lock.yaml'
            - 'pnpm-workspace.yaml'
            - 'common/**'
            - 'config/**'
            - 'consumer-smoke/**'
            - 'demo-app/.env.example'
            - 'demo-app/phpunit.xml.dist'
            - 'resources/**'
            - 'release.sh'
            - '.github/workflows/tests.yml'

concurrency:
    group: ${{ github.workflow }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
    cancel-in-progress: true

permissions: {}

jobs:
    # Keep release-artifact package checks outside the Browser and consumer matrices.
    # Matrix jobs consume these dist files instead of rebuilding per variation.
    package-surface:
        name: Integration Package Surface
        timeout-minutes: 15
        runs-on: ubuntu-latest
        if: "github.event_name == 'pull_request' || (!contains(github.event.head_commit.message, '[only-quality]') && !contains(github.event.head_commit.message, '[ci-skip]') && !contains(github.event.head_commit.message, '[skip-ci]'))"

        permissions:
            contents: read

        steps:
            - name: Harden runner
              uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
              with:
                  egress-policy: audit

            - name: Checkout code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Install pnpm
              uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

            - name: Setup Node.js
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: lts/*
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Build frontend packages
              run: |
                  pnpm --filter @inertiaui/modal-vue run build
                  pnpm --filter @inertiaui/modal-react run build

            - name: Upload built frontend packages
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: integration-built-frontend-packages
                  path: |
                      vue/dist
                      react/dist
                  if-no-files-found: error
                  retention-days: 1

    tests:
        name: Pest L${{ matrix.laravel }} (${{ matrix.stack }}), App Mounting ${{ matrix.app_mounting }}, Native Dialog ${{ matrix.native_dialog }}
        timeout-minutes: 15
        runs-on: ubuntu-latest
        needs: package-surface
        if: "github.event_name == 'pull_request' || (!contains(github.event.head_commit.message, '[only-quality]') && !contains(github.event.head_commit.message, '[ci-skip]') && !contains(github.event.head_commit.message, '[skip-ci]'))"

        permissions:
            contents: read

        strategy:
            fail-fast: false
            matrix:
                laravel: ['13.0', '12.0']
                stack: [react, vue]
                app_mounting: [auto, custom]
                native_dialog: [true, false]

        env:
            APP_URL: 'http://127.0.0.1:8000'
            DB_CONNECTION: sqlite
            APP_STACK: ${{ matrix.stack }}
            VITE_USE_NATIVE_DIALOG: ${{ matrix.native_dialog }}
            MATRIX_LARAVEL: ${{ matrix.laravel }}
            MATRIX_STACK: ${{ matrix.stack }}

        steps:
            - name: Harden runner
              uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
              with:
                  egress-policy: audit

            - name: Checkout code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Download built frontend packages
              uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
              with:
                  name: integration-built-frontend-packages
                  path: .

            - name: Setup PHP
              uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
              with:
                  php-version: ${{ matrix.laravel == '13.0' && '8.4' || '8.3' }}
                  extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv, imagick, mysql, mysqli, pdo_mysql
                  coverage: none

            - name: Install pnpm
              uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

            - name: Setup Node.js
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: lts/*
                  cache: pnpm

            - name: Get Composer Cache Directory
              id: composer-cache
              run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

            - name: Cache composer
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: ${{ steps.composer-cache.outputs.dir }}
                  key: ${{ runner.os }}-composer-${{ matrix.stack }}-${{ hashFiles('**/composer.lock') }}
                  restore-keys: |
                      ${{ runner.os }}-composer-${{ matrix.stack }}-
                      ${{ runner.os }}-composer-

            - name: Install pnpm dependencies
              run: pnpm install --frozen-lockfile

            - name: Prepare The Environment
              run: |
                  cd demo-app
                  cp .env.example .env

            - name: Set React Environment Variables
              if: ${{ matrix.stack == 'react' }}
              run: |
                  cd demo-app
                  sed -i -e "s|APP_STACK=vue|APP_STACK=react|g" .env

            - name: Test libraries
              env:
                  MATRIX_STACK: ${{ matrix.stack }}
              run: pnpm --filter "@inertiaui/modal-$MATRIX_STACK" run test --run

            - name: Switch to custom app mounting
              if: ${{ matrix.app_mounting == 'custom' }}
              run: |
                  cd demo-app/resources/js
                  mv app-custom-mount.js app.js
                  mv app-custom-mount.jsx app.jsx

            - name: Prepare Laravel app
              run: |
                  cd demo-app
                  if [ "$MATRIX_LARAVEL" == "13.0" ]; then
                    composer remove laravel/tinker --no-update
                    composer require "laravel/framework:^$MATRIX_LARAVEL" --no-update --no-interaction
                    composer update -W --no-progress --prefer-dist --no-interaction
                  else
                    composer require "laravel/framework:^$MATRIX_LARAVEL" --no-interaction
                  fi
                  php artisan about
                  test -d node_modules/@inertiaui/modal-react || exit 1
                  test -d node_modules/@inertiaui/modal-vue || exit 1
                  pnpm --filter demo-app run build
                  php artisan key:generate
                  touch database/database.sqlite
                  php artisan migrate:fresh --seed

            - name: Install Playwright
              run: |
                  cd demo-app
                  pnpm exec playwright install --with-deps chromium

            - name: Run tests
              run: |
                  cd demo-app
                  ./vendor/bin/pest --parallel

            - name: Upload artifacts on failure
              if: failure()
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: pest-artifacts-${{ matrix.laravel }}-${{ matrix.stack }}-${{ matrix.app_mounting }}-${{ matrix.native_dialog }}
                  path: |
                      demo-app/tests/Browser/Screenshots
                      demo-app/storage/logs

    consumer-smoke:
        name: Consumer Smoke (${{ matrix.stack }})
        timeout-minutes: 20
        runs-on: ubuntu-latest
        needs: package-surface
        if: "github.event_name == 'pull_request' || (!contains(github.event.head_commit.message, '[only-quality]') && !contains(github.event.head_commit.message, '[ci-skip]') && !contains(github.event.head_commit.message, '[skip-ci]'))"

        permissions:
            contents: read

        strategy:
            fail-fast: false
            matrix:
                stack: [vue, react]

        steps:
            - name: Harden runner
              uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
              with:
                  egress-policy: audit

            - name: Checkout code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Setup PHP
              uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
              with:
                  php-version: '8.4'
                  extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, intl
                  coverage: none

            - name: Setup Node.js
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: '22'

            - name: Download built frontend packages
              uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
              with:
                  name: integration-built-frontend-packages
                  path: .

            - name: Install smoke-test dependencies
              run: |
                  npm install --no-audit --no-fund
                  npx playwright install --with-deps chromium
              working-directory: consumer-smoke

            - name: Scaffold + build the consumer app
              id: scaffold
              env:
                  STACK: ${{ matrix.stack }}
                  MODAL_REPO: ${{ github.workspace }}
                  WORK: ${{ runner.temp }}/modal-consumer-smoke-${{ matrix.stack }}
              run: |
                  set -o pipefail
                  SETUP_LOG="$RUNNER_TEMP/modal-consumer-setup-${{ matrix.stack }}.log"
                  bash consumer-smoke/setup.sh | tee "$SETUP_LOG"
                  consumer="$(tail -1 "$SETUP_LOG")"
                  test -n "$consumer"
                  test -d "$consumer"
                  echo "consumer=$consumer" >> "$GITHUB_OUTPUT"

            - name: Serve + smoke test
              env:
                  CONSUMER: ${{ steps.scaffold.outputs.consumer }}
              run: |
                  cd "$CONSUMER"
                  SERVE_LOG="$RUNNER_TEMP/modal-consumer-serve-${{ matrix.stack }}.log"
                  php artisan serve --host=127.0.0.1 --port=8000 > "$SERVE_LOG" 2>&1 &
                  SERVER_PID=$!
                  trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
                  READY=false
                  for i in $(seq 1 30); do
                      if curl -fsS -o /dev/null "http://127.0.0.1:8000/modal-smoke" 2>/dev/null; then
                          READY=true
                          break
                      fi
                      sleep 1
                  done
                  if [ "$READY" != true ]; then
                      echo "Consumer app did not become ready on port 8000" >&2
                      cat "$SERVE_LOG" >&2 || true
                      exit 1
                  fi
                  node "$GITHUB_WORKSPACE/consumer-smoke/smoke.mjs" "http://127.0.0.1:8000"

            - name: Upload logs on failure
              if: failure()
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: consumer-smoke-${{ matrix.stack }}
                  path: |
                      ${{ runner.temp }}/modal-consumer-setup-${{ matrix.stack }}.log
                      ${{ runner.temp }}/modal-consumer-serve-${{ matrix.stack }}.log
