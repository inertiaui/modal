name: 'Update Changelog'

on:
    release:
        types: [released]

permissions: {}

jobs:
    update:
        runs-on: ubuntu-latest
        timeout-minutes: 5
        permissions:
            contents: write

        steps:
            - name: Harden runner
              uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
              with:
                  egress-policy: audit

            - name: Determine branch from tag
              id: branch
              env:
                  TAG: ${{ github.event.release.tag_name }}
              run: |
                  if [[ "$TAG" == 2.* ]]; then
                    echo "name=2.x" >> "$GITHUB_OUTPUT"
                  else
                    echo "name=3.x" >> "$GITHUB_OUTPUT"
                  fi

            - name: Checkout code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  ref: ${{ steps.branch.outputs.name }}

            - name: Update Changelog
              uses: stefanzweifel/changelog-updater-action@a938690fad7edf25368f37e43a1ed1b34303eb36 # v1.12.0
              with:
                  latest-version: ${{ github.event.release.name }}
                  release-notes: ${{ github.event.release.body }}

            - name: Commit updated CHANGELOG
              uses: stefanzweifel/git-auto-commit-action@d0b01107b5db882071f96de5dd4b54961ea93f4c # v7.2.1
              with:
                  branch: ${{ steps.branch.outputs.name }}
                  commit_message: Update CHANGELOG
                  file_pattern: CHANGELOG.md
