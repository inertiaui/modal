name: Analyse with ESLint

on:
  pull_request:
    branches: [develop]
  push:
    paths:
      - "**.js"
      - "**.jsx"
      - "**.vue"
      - "react/.eslintrc.cjs"
      - "react/.prettierrc"
      - "react/package.json"
      - "vue/.eslintrc.cjs"
      - "vue/.prettierrc"
      - "vue/package.json"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/eslint.yml"

permissions:
  contents: read

jobs:
  eslint:
    name: ESLint Code Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.head_ref }}

      - name: Install pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: lts/*
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint
        run: |
          pnpm --filter @inertiaui/modal-vue run eslint
          pnpm --filter @inertiaui/modal-react run eslint

      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@04702edda442b2e678b25b537cec683a1493fcb9 # v7.1.0
        with:
          commit_message: Fix styling
