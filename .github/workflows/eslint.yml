name: JS Quality and Style

on:
    push:
        paths:
            - '**.js'
            - '**.jsx'
            - '**.ts'
            - '**.tsx'
            - '**.vue'
            - '**.mjs'
            - 'react/package.json'
            - 'react/tsconfig.json'
            - 'vue/package.json'
            - 'vue/tsconfig.json'
            - '.oxlintrc.json'
            - '.oxfmtrc.json'
            - '.github/workflows/eslint.yml'

concurrency:
    group: ${{ github.workflow }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
    cancel-in-progress: true

permissions: {}

jobs:
    js-quality:
        name: JS Quality and Style
        runs-on: ubuntu-latest
        timeout-minutes: 5
        permissions:
            contents: write

        steps:
            - name: Harden runner
              uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
              with:
                  egress-policy: audit

            - name: Checkout code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  ref: ${{ github.head_ref }}

            - name: Install pnpm
              uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

            - name: Setup Node.js
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: lts/*
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Run Oxlint (auto-fix)
              run: pnpm run lint

            - name: Run Oxfmt (auto-fix)
              run: pnpm run format

            - name: Commit changes
              uses: stefanzweifel/git-auto-commit-action@d0b01107b5db882071f96de5dd4b54961ea93f4c # v7.2.1
              with:
                  commit_message: Fix styling
