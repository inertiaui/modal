# Please see the documentation for all configuration options:
# https://help.github.com/github/administering-a-repository/configuration-options-for-dependency-updates

version: 2
updates:
    - package-ecosystem: 'github-actions'
      directory: '/'
      schedule:
          interval: 'weekly'
      cooldown:
          default-days: 5
      labels:
          - 'dependencies'
      groups:
          github-actions:
              patterns:
                  - '*'
    - package-ecosystem: 'github-actions'
      directory: '/'
      schedule:
          interval: 'weekly'
      cooldown:
          default-days: 5
      target-branch: '2.x'
      labels:
          - 'dependencies'
      groups:
          github-actions:
              patterns:
                  - '*'
